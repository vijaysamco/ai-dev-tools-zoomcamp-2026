services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: relay
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d relay"]
      interval: 5s
      timeout: 5s
      retries: 10

  relay:
    build:
      context: .
    image: agent-relay:local
    environment:
      RELAY_DATABASE_URL: postgresql+psycopg://relay:relay@postgres:5432/relay
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  postgres_data:
