<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SplitEase</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand-block">
          <div class="brand-mark">S</div>
          <div>
            <p class="eyebrow">Expense tracker</p>
            <h1>SplitEase</h1>
          </div>
        </div>

        <section class="panel">
          <h2>Group</h2>
          <div class="stack">
            <label>
              <span>Group name</span>
              <input id="group-name-input" type="text" placeholder="Weekend trip" />
            </label>
            <button id="create-group-btn" class="primary">Create group</button>
          </div>
        </section>

        <section class="panel">
          <h2>Add member</h2>
          <div class="stack">
            <label>
              <span>Member name</span>
              <input id="member-name-input" type="text" placeholder="Alex" />
            </label>
            <button id="add-member-btn" class="secondary">Add member</button>
          </div>
        </section>

        <section class="panel">
          <h2>New expense</h2>
          <form id="expense-form" class="stack">
            <label>
              <span>Description</span>
              <input id="expense-description" type="text" placeholder="Groceries" required />
            </label>

            <label>
              <span>Amount</span>
              <input id="expense-amount" type="number" min="0" step="0.01" placeholder="120.00" required />
            </label>

            <label>
              <span>Date</span>
              <input id="expense-date" type="date" required />
            </label>

            <label>
              <span>Payer</span>
              <select id="expense-payer"></select>
            </label>

            <label>
              <span>Split method</span>
              <select id="expense-split-type">
                <option value="equal">Equal split</option>
                <option value="custom">Custom split</option>
              </select>
            </label>

            <div id="participant-selection" class="participant-list"></div>

            <div id="custom-split-section" class="hidden">
              <h3>Custom shares</h3>
              <div id="custom-split-inputs" class="custom-split-inputs"></div>
            </div>

            <button class="primary" type="submit">Add expense</button>
          </form>
        </section>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <div>
            <p class="eyebrow">Current group</p>
            <h2 id="group-name">Loading...</h2>
          </div>
          <div class="pill" id="member-count-pill">0 members</div>
        </header>

        <section class="summary-grid">
          <article class="summary-card accent">
            <span>Total expenses</span>
            <strong id="total-expense">$0.00</strong>
          </article>
          <article class="summary-card">
            <span>Members</span>
            <strong id="member-total">0</strong>
          </article>
          <article class="summary-card">
            <span>Settled status</span>
            <strong id="settled-status">Balanced</strong>
          </article>
        </section>

        <section class="content-grid">
          <div class="panel">
            <div class="panel-header">
              <h3>Balances</h3>
            </div>
            <div id="balances-list" class="balances-list"></div>
          </div>

          <div class="panel">
            <div class="panel-header">
              <h3>Recent expenses</h3>
            </div>
            <ul id="expense-list" class="expense-list"></ul>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
