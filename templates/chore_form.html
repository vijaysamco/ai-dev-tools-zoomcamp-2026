{% extends 'base.html' %}

{% block title %}{% if chore %}Edit chore{% else %}Add chore{% endif %}{% endblock %}

{% block content %}
    <h1>{% if chore %}Edit chore{% else %}Add chore{% endif %}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save</button>
    </form>
    <p><a href="{% url 'dashboard' %}">Back to dashboard</a></p>
{% endblock %}
