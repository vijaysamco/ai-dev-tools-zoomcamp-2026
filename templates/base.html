<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Household Chore Manager{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2rem; background: #f6f7fb; color: #1f2937; }
        .container { max-width: 900px; margin: 0 auto; }
        nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        .nav-links a { margin-left: 1rem; text-decoration: none; color: #1d4ed8; }
        .card { background: #fff; border-radius: 10px; padding: 1.5rem; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
        .messages { margin-bottom: 1rem; }
        .message { padding: 0.75rem 1rem; border-radius: 8px; margin-bottom: 0.75rem; }
        .message.success { background: #dcfce7; color: #166534; }
        .message.error { background: #fee2e2; color: #991b1b; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1rem; }
        form { display: grid; gap: 0.75rem; }
        input, button { padding: 0.65rem 0.8rem; font-size: 1rem; }
        button { background: #2563eb; color: white; border: none; border-radius: 8px; cursor: pointer; }
        .muted { color: #4b5563; }
    </style>
</head>
<body>
    <div class="container">
        <nav>
            <strong>Household Chore Manager</strong>
            <div class="nav-links">
                {% if user.is_authenticated %}
                    <a href="{% url 'dashboard' %}">Dashboard</a>
                    <a href="{% url 'logout' %}">Logout</a>
                {% else %}
                    <a href="{% url 'login' %}">Login</a>
                    <a href="{% url 'signup' %}">Sign up</a>
                {% endif %}
            </div>
        </nav>

        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <div class="message {{ message.tags }}">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}

        <div class="card">
            {% block content %}{% endblock %}
        </div>
    </div>
</body>
</html>
