{% extends 'base.html' %}

{% block title %}Sign up{% endblock %}

{% block content %}
    <h1>Create account</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Create account</button>
    </form>
    <p class="muted">Already have an account? <a href="{% url 'login' %}">Log in</a></p>
{% endblock %}
